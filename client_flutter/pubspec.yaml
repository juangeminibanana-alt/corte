name: corte
description: CUTGC para Android, Windows y web, conectado a Google Cloud.
publish_to: none
version: 2.4.11+20411

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: 1.6.0
  crypto: 3.0.8
  url_launcher: 6.3.3
  web: 1.1.2
  path_provider: 2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-MonaSans.txt
    - assets/fonts/OFL-CUTGCWebSans.txt
    - assets/icons/LICENSE-Lucide.txt
  fonts:
    - family: MonaSans
      fonts:
        - asset: assets/fonts/CUTGCWebSans.ttf
    - family: MonaSansExtended
      fonts:
        - asset: assets/fonts/MonaSans.ttf
