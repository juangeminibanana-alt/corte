steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - cloud/google/Dockerfile.backend
      - --build-arg
      - BASE_IMAGE=${_BASE_IMAGE}
      - --build-arg
      - SOURCE_COMMIT=${_SOURCE_COMMIT}
      - --tag
      - ${_IMAGE_URI}
      - .
images: ['${_IMAGE_URI}']
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 600s
