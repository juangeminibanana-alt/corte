plugins { id 'com.android.application' }

android {
    namespace 'app.creatorhub'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'app.creatorhub.qa'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName 'qa-aislada'
        buildConfigField 'boolean', 'CLOUD_ENABLED', 'true'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets {
        main {
            java.srcDirs = ['src/main/java', '../app/src/main/java']
            java.includes = ['app/creatorhub/Nucleo.java', 'app/creatorhub/datos/**', 'app/creatorhub/red/**', 'app/creatorhub/qa/**']
        }
    }
}
dependencies { }
